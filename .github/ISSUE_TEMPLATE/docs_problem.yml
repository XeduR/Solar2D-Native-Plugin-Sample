name: Problem with docs
description: Report something missing, wrong, or unclear in the documentation.

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is missing, wrong, or unclear?
      placeholder: e.g. The manual build commands fail because a path in them does not exist.
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Which docs
      description: The file and section.
      placeholder: e.g. BUILDING.md, Installing for App Builds

  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: What the docs should say instead, if you know.
      placeholder: e.g. Replace the path with the one the build writes to.
