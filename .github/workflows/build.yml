name: Build Plugin

# Manual dispatch only. A build runs up to nine jobs, so it runs when a build
# is actually wanted, not on every commit. A run builds the platforms listed
# in metadata.json, runs the test hook, packages the results, and creates or
# updates the v<pluginVersion> release.
on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and a run in progress is never cancelled: it ends by writing a release.
concurrency:
  group: build-plugin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # cmake --build runs up to this many jobs at once; public-repo Linux and Windows runners have 4 CPUs.
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  config:
    name: Read metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name_dotted: ${{ steps.meta.outputs.name_dotted }}
      name_underscored: ${{ steps.meta.outputs.name_underscored }}
      has_tests: ${{ steps.meta.outputs.has_tests }}
      publisher_id: ${{ steps.meta.outputs.publisher_id }}
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      solar2d_build: ${{ steps.meta.outputs.solar2d_build }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7

      - name: Read metadata.json
        id: meta
        run: |
          set -eo pipefail
          # Shared parser/validator; fails the step on invalid fields.
          . tools/read_metadata.sh

          # The test job runs only when the repository carries a test hook.
          if [ -f test/ci_test.sh ]; then
            HAS_TESTS=true
          else
            HAS_TESTS=false
          fi

          {
            echo "name_dotted=${PLUGIN_NAME_DOTTED}"
            echo "name_underscored=${PLUGIN_NAME_UNDERSCORED}"
            echo "has_tests=${HAS_TESTS}"
            echo "publisher_id=${PUBLISHER_ID}"
            echo "plugin_version=${PLUGIN_VERSION}"
            echo "solar2d_build=${SOLAR2D_BUILD}"
            echo "platforms=${PLATFORMS}"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows (x86)
    needs: config
    if: contains(fromJSON(needs.config.outputs.platforms), 'windows')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC (x86)
        # Third-party action, pinned by commit SHA because a tag can be moved.
        # 79dac24 is release 4.0.0.
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c
        with:
          arch: x86

      - name: Generate Lua 5.1 import library from .def
        shell: cmd
        run: lib /def:external\lua51\lua51.def /out:lua51.lib /machine:x86

      - name: Configure CMake (x86)
        run: cmake -B build -A Win32 -DLUA_LIBRARY="${{ github.workspace }}/lua51.lib"

      - name: Build
        run: cmake --build build --config Release --target "${NAME}"

      - name: Verify output shape
        shell: cmd
        run: dumpbin /exports build\Release\%NAME%.dll | findstr /r /c:" luaopen_%NAME%$" /c:" luaopen_%NAME% "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: win32-sim
          path: build/Release/${{ needs.config.outputs.name_underscored }}.dll
          if-no-files-found: error

  build-macos:
    name: macOS (Universal)
    needs: config
    if: contains(fromJSON(needs.config.outputs.platforms), 'macos')
    # macos-15 for its default Xcode 16.4; Xcode 26 on macos-latest drops the macOS 10.13 target.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
      # x86_64 matches the engine's macOS floor (S2D_MIN_VER_MACOS); arm64
      # starts at macOS 11, the first release on Apple silicon.
      MACOS_MIN_X86_64: "10.13"
      MACOS_MIN_ARM64: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake (x86_64)
        run: >-
          cmake -B build-x64 -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_MIN_X86_64}" -DCMAKE_BUILD_TYPE=Release

      - name: Build (x86_64)
        run: cmake --build build-x64 --config Release --target "${NAME}"

      - name: Configure CMake (arm64)
        run: >-
          cmake -B build-arm64 -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_MIN_ARM64}" -DCMAKE_BUILD_TYPE=Release

      - name: Build (arm64)
        run: cmake --build build-arm64 --config Release --target "${NAME}"

      - name: Create universal binary
        run: |
          set -eo pipefail
          lipo -create \
            "build-x64/${NAME}.dylib" \
            "build-arm64/${NAME}.dylib" \
            -output "${NAME}.dylib"
          lipo -info "${NAME}.dylib"

      - name: Verify output shape
        run: |
          set -eo pipefail
          lipo -info "${NAME}.dylib" | grep -q "x86_64"
          lipo -info "${NAME}.dylib" | grep -q "arm64"
          # Plain grep, not -q: with pipefail, grep -q exiting at first match
          # can SIGPIPE the producer and fail a healthy build.
          nm -g "${NAME}.dylib" | grep -E " T _luaopen_${NAME}$"

          otool -arch x86_64 -l "${NAME}.dylib" | grep -E "(minos|version)[[:space:]]+${MACOS_MIN_X86_64//./\\.}([[:space:]]|$)" > /dev/null
          otool -arch arm64 -l "${NAME}.dylib" | grep -E "minos[[:space:]]+${MACOS_MIN_ARM64//./\\.}([[:space:]]|$)" > /dev/null

          # Every dependency must ship with macOS, never a build machine's
          # Homebrew or MacPorts copy; the first entry per slice is the dylib's own ID.
          otool -L "${NAME}.dylib" | awk '/^[[:space:]]/ { print $1 }' | grep -v "/${NAME}\.dylib$" | sort -u > dependencies.txt
          cat dependencies.txt
          if grep -vE "^(/usr/lib/|/System/Library/)" dependencies.txt; then
            echo "ERROR: ${NAME}.dylib links a library macOS does not ship"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-sim
          path: ${{ needs.config.outputs.name_underscored }}.dylib
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64)
    needs: config
    if: contains(fromJSON(needs.config.outputs.platforms), 'linux')
    runs-on: ubuntu-latest
    # Built on Ubuntu 20.04 (glibc 2.31) so the library loads there and on
    # anything newer; a newer build base emits glibc symbol versions that older
    # systems lack, and the plugin then fails to load on them.
    container: ubuntu:20.04
    timeout-minutes: 30
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The container runs as root with a bare image: no sudo, compiler, or git.
      - name: Install the build toolchain
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl file git

      - uses: actions/checkout@v7

      # Ubuntu 20.04's own CMake is older than the 3.19 floor.
      - name: Pin CMake
        run: bash tools/pin_cmake.sh

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target "${NAME}"

      - name: Verify output shape
        run: |
          set -eo pipefail
          file "build/${NAME}.so"
          nm -D --defined-only "build/${NAME}.so" | grep -E " luaopen_${NAME}$"

          # Ubuntu 20.04 ships glibc 2.31 and GCC 9's libstdc++ (GLIBCXX_3.4.28,
          # CXXABI_1.3.12); any newer symbol version fails to load there.
          objdump -T "build/${NAME}.so" | grep -oE "(GLIBC|GLIBCXX|CXXABI)_[0-9]+(\.[0-9]+)*" | sort -u > symbol_versions.txt
          cat symbol_versions.txt
          while read -r tag; do
            case "${tag%%_*}" in
              GLIBC) newest="2.31" ;;
              GLIBCXX) newest="3.4.28" ;;
              CXXABI) newest="1.3.12" ;;
            esac
            if [ "$(printf '%s\n%s\n' "${tag#*_}" "${newest}" | sort -V | tail -n 1)" != "${newest}" ]; then
              echo "ERROR: ${NAME}.so requires ${tag}, newer than Ubuntu 20.04 provides"
              exit 1
            fi
          done < symbol_versions.txt

          # Only the C/C++ runtime and the X11 client libraries every Linux
          # desktop ships; anything else is a system copy of a bundled library.
          readelf -d "build/${NAME}.so" | awk '/NEEDED/ { gsub(/[][]/, "", $5); print $5 }' > dependencies.txt
          cat dependencies.txt
          if grep -vE "^((libc|libm|libdl|libpthread|librt|libgcc_s|ld-linux-x86-64)\.so\.[0-9]+|libstdc\+\+\.so\.6|libX[A-Za-z0-9]*\.so\.[0-9]+)$" dependencies.txt; then
            echo "ERROR: ${NAME}.so links a library outside the C/C++ runtime and X11"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: build/${{ needs.config.outputs.name_underscored }}.so
          if-no-files-found: error

  build-ios:
    name: iOS (device + simulator)
    needs: config
    if: contains(fromJSON(needs.config.outputs.platforms), 'ios')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
    steps:
      - uses: actions/checkout@v7

      - name: Build iOS static libraries
        run: bash tools/build_apple.sh ios build-ios

      - name: Verify output shape
        run: |
          set -eo pipefail
          file "build-ios/device/lib${NAME}.a" "build-ios/simulator/lib${NAME}.a"
          lipo -info "build-ios/device/lib${NAME}.a" | grep -q "arm64"
          lipo -info "build-ios/simulator/lib${NAME}.a" | grep -q "arm64"
          lipo -info "build-ios/simulator/lib${NAME}.a" | grep -q "x86_64"
          nm "build-ios/device/lib${NAME}.a" 2>/dev/null | grep -E " T _luaopen_${NAME}$"
          # Redirect to /dev/null, not grep -q: -q exits at first match and can
          # SIGPIPE the otool producer, failing a healthy build under pipefail.
          otool -l "build-ios/device/lib${NAME}.a" | grep -E "(minos|version)[[:space:]]+15\." > /dev/null

      - name: Upload device artifact
        uses: actions/upload-artifact@v7
        with:
          name: iphone
          path: build-ios/device/lib${{ needs.config.outputs.name_underscored }}.a
          if-no-files-found: error

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: iphone-sim
          path: build-ios/simulator/lib${{ needs.config.outputs.name_underscored }}.a
          if-no-files-found: error

  build-tvos:
    name: tvOS (device + simulator)
    needs: config
    if: contains(fromJSON(needs.config.outputs.platforms), 'tvos')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
    steps:
      - uses: actions/checkout@v7

      - name: Build tvOS static libraries
        run: bash tools/build_apple.sh tvos build-tvos

      - name: Verify output shape
        run: |
          set -eo pipefail
          file "build-tvos/device/lib${NAME}.a" "build-tvos/simulator/lib${NAME}.a"
          lipo -info "build-tvos/device/lib${NAME}.a" | grep -q "arm64"
          lipo -info "build-tvos/simulator/lib${NAME}.a" | grep -q "arm64"
          lipo -info "build-tvos/simulator/lib${NAME}.a" | grep -q "x86_64"
          nm "build-tvos/device/lib${NAME}.a" 2>/dev/null | grep -E " T _luaopen_${NAME}$"
          # Redirect to /dev/null, not grep -q: -q exits at first match and can
          # SIGPIPE the otool producer, failing a healthy build under pipefail.
          otool -l "build-tvos/device/lib${NAME}.a" | grep -E "(minos|version)[[:space:]]+15\." > /dev/null

      - name: Upload device artifact
        uses: actions/upload-artifact@v7
        with:
          name: appletvos
          path: build-tvos/device/lib${{ needs.config.outputs.name_underscored }}.a
          if-no-files-found: error

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v7
        with:
          name: appletvsimulator
          path: build-tvos/simulator/lib${{ needs.config.outputs.name_underscored }}.a
          if-no-files-found: error

  build-android:
    name: Android (multi-ABI)
    needs: config
    if: contains(fromJSON(needs.config.outputs.platforms), 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
    steps:
      - uses: actions/checkout@v7

      - name: Build Android shared libraries
        run: bash tools/build_android.sh build-android

      - name: Verify output shape
        run: |
          set -eo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            f="build-android/$abi/lib${NAME}.so"
            file "$f"
            # -W: without it readelf truncates names past 21 characters to "[...]".
            readelf -W --dyn-syms "$f" | grep -E " luaopen_${NAME}$"

            # Every LOAD segment must be 16 KB-aligned or the library fails to
            # load on Android 15+ devices with 16 KB pages.
            for align in $(readelf -lW "$f" | awk '$1 == "LOAD" {print $NF}'); do
              if [ $(( align )) -lt 16384 ]; then
                echo "ERROR: $f LOAD segment alignment $align is below 16 KB"
                exit 1
              fi
            done

            # Solar2D apps ship no libc++_shared.so; guards against the
            # ANDROID_STL=c++_static default changing.
            if readelf -d "$f" | grep "libc++_shared"; then
              echo "ERROR: $f depends on libc++_shared.so"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: build-android/*/lib${{ needs.config.outputs.name_underscored }}.so
          if-no-files-found: error

  test:
    name: Test
    needs: config
    if: needs.config.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          set -eo pipefail
          if [ -f test/ci_apt.txt ]; then
            sudo apt-get update
            xargs -a test/ci_apt.txt sudo apt-get install -y
          fi

      - name: Run the test hook
        run: bash test/ci_test.sh

  package:
    name: Package Plugin Distribution
    needs: [config, build-windows, build-macos, build-linux, build-ios, build-tvos, build-android, test]
    # Skipped jobs must not skip packaging; failed or cancelled (timed-out) jobs are refused by the first step below.
    if: ${{ !cancelled() && needs.config.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release step is the only one that writes to the repository.
    permissions:
      contents: write
    env:
      NAME: ${{ needs.config.outputs.name_underscored }}
      NAME_DOTTED: ${{ needs.config.outputs.name_dotted }}
      PUBLISHER: ${{ needs.config.outputs.publisher_id }}
      SOLAR2D_BUILD: ${{ needs.config.outputs.solar2d_build }}
      PLATFORMS: ${{ needs.config.outputs.platforms }}
    steps:
      - name: Fail when any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled; refusing to package."
          exit 1

      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Create plugin distribution structure
        run: |
          set -eo pipefail
          # The distribution version directory is the minimum Solar2D build number.
          BUILD="${SOLAR2D_BUILD}"

          # The committed identity comes from the fallback's filename, so
          # renaming the plugin in metadata.json rewrites everything; the first
          # underscore becomes the dot. Only that one Lua file ships, so
          # anything extra in lua/ is refused rather than dropped silently.
          luaFiles=()
          for f in lua/*.lua; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            if [ "$base" != "metadata.lua" ]; then
              luaFiles+=("$base")
            fi
          done
          if [ "${#luaFiles[@]}" -ne 1 ]; then
            echo "ERROR: lua/ must hold metadata.lua plus exactly one fallback Lua file, found ${#luaFiles[@]}: ${luaFiles[*]}"
            exit 1
          fi
          SRC="${luaFiles[0]%.lua}"
          SRC_DOTTED="${SRC/_/.}"
          SRC_ESC="${SRC//./\\.}"
          SRC_DOTTED_ESC="${SRC_DOTTED//./\\.}"

          # Each rule matches the source name followed by a word boundary or an
          # underscore, covering identifiers derived from it (plugin_hello_state)
          # without touching longer names that merely start with it (underscore is
          # a word character, so a trailing \b alone cannot). Values are sed-safe per the validator.
          rewrite() {
            sed -e "s/\b${SRC_DOTTED_ESC}\(\b\|_\)/${NAME_DOTTED}\1/g" \
                -e "s/\b${SRC_ESC}\(\b\|_\)/${NAME}\1/g" \
                -e "s/\bcom\.xedur\b/${PUBLISHER}/g"
          }

          # The fallback ships on its require path: plugin/<name>.lua.
          NAME_PATH="${NAME_DOTTED//./\/}"

          # Platform tokens map to the engine's platform directories; web and
          # lua ship regardless. The app-build directories (win32, macos) carry
          # the same binaries as their simulator counterparts.
          DIST_PLATFORMS="web lua"
          for token in $(echo "${PLATFORMS}" | jq -r '.[]'); do
            case "$token" in
              windows) DIST_PLATFORMS="$DIST_PLATFORMS win32-sim win32" ;;
              macos) DIST_PLATFORMS="$DIST_PLATFORMS mac-sim macos" ;;
              linux) DIST_PLATFORMS="$DIST_PLATFORMS linux" ;;
              ios) DIST_PLATFORMS="$DIST_PLATFORMS iphone iphone-sim" ;;
              tvos) DIST_PLATFORMS="$DIST_PLATFORMS appletvos appletvsimulator" ;;
              android) DIST_PLATFORMS="$DIST_PLATFORMS android" ;;
            esac
          done
          echo "DIST_PLATFORMS=${DIST_PLATFORMS}" >> "$GITHUB_ENV"

          for platform in $DIST_PLATFORMS; do
            mkdir -p "dist/plugins/${BUILD}/${platform}"
          done

          # Native binaries per platform token
          for token in $(echo "${PLATFORMS}" | jq -r '.[]'); do
            case "$token" in
              windows)
                cp "artifacts/win32-sim/${NAME}.dll" "dist/plugins/${BUILD}/win32-sim/"
                cp "artifacts/win32-sim/${NAME}.dll" "dist/plugins/${BUILD}/win32/"
                ;;
              macos)
                cp "artifacts/mac-sim/${NAME}.dylib" "dist/plugins/${BUILD}/mac-sim/"
                cp "artifacts/mac-sim/${NAME}.dylib" "dist/plugins/${BUILD}/macos/"
                ;;
              linux)
                # Linux app builds copy only x86-64/ and lua/lua_51/ out of a
                # payload, and the loader resolves <require name>.so literally,
                # so the binary ships under the dotted name.
                mkdir -p "dist/plugins/${BUILD}/linux/x86-64"
                cp "artifacts/linux/${NAME}.so" "dist/plugins/${BUILD}/linux/x86-64/${NAME_DOTTED}.so"
                ;;
              ios)
                cp "artifacts/iphone/lib${NAME}.a" "dist/plugins/${BUILD}/iphone/"
                cp "artifacts/iphone-sim/lib${NAME}.a" "dist/plugins/${BUILD}/iphone-sim/"
                ;;
              tvos)
                cp "artifacts/appletvos/lib${NAME}.a" "dist/plugins/${BUILD}/appletvos/"
                cp "artifacts/appletvsimulator/lib${NAME}.a" "dist/plugins/${BUILD}/appletvsimulator/"
                ;;
              android)
                # The engine only collects plugin native libraries from
                # jniLibs/<abi>/ paths, and dlopens lib<require name>.so.
                for abiDir in artifacts/android/*/; do
                  abi="$(basename "${abiDir}")"
                  mkdir -p "dist/plugins/${BUILD}/android/jniLibs/${abi}"
                  cp "${abiDir}lib${NAME}.so" "dist/plugins/${BUILD}/android/jniLibs/${abi}/lib${NAME_DOTTED}.so"
                done
                ;;
            esac
          done

          # The HTML5 loader looks the .js file up under the underscored name.
          rewrite < "web/${SRC}.js" > "dist/plugins/${BUILD}/web/${NAME}.js"
          cp web/metadata.lua "dist/plugins/${BUILD}/web/"

          # The fallback ships under both lua_51/ and lua/lua_51/: the collector
          # merges the payload root up for most platforms, Linux reads only the latter.
          for luaRoot in lua_51 lua/lua_51; do
            dst="dist/plugins/${BUILD}/lua/${luaRoot}/${NAME_PATH}.lua"
            mkdir -p "$(dirname "$dst")"
            rewrite < "lua/${SRC}.lua" > "$dst"
          done
          cp lua/metadata.lua "dist/plugins/${BUILD}/lua/"

          # staticLibrary + staticLibs for the Apple mobile archives (the
          # staticLibs name is the binary name), sharedLibrary elsewhere;
          # metadata.lua always sits at the payload root, however nested the payload.
          for platform in $DIST_PLATFORMS; do
            case "$platform" in
              web|lua)
                ;;
              iphone|iphone-sim|appletvos|appletvsimulator)
                cat > "dist/plugins/${BUILD}/${platform}/metadata.lua" << METALUA
          local metadata =
          {
              plugin =
              {
                  format = "staticLibrary",
                  staticLibs = { "${NAME}" },
                  frameworks = {},
                  frameworksOptional = {},
              },
          }
          return metadata
          METALUA
                ;;
              *)
                cat > "dist/plugins/${BUILD}/${platform}/metadata.lua" << 'METALUA'
          local metadata =
          {
              plugin =
              {
                  format = "sharedLibrary",
              },
          }
          return metadata
          METALUA
                ;;
            esac
          done

          echo "Plugin distribution structure:"
          find dist -type f | sort

      - name: Create per-platform tarballs
        run: |
          set -eo pipefail
          BUILD="${SOLAR2D_BUILD}"

          # Ready-to-install structure: <publisherId>/<plugin.name>/<platform>/data.tgz
          INSTALL_DIR="$(pwd)/dist/install"
          for platform in $DIST_PLATFORMS; do
            mkdir -p "${INSTALL_DIR}/${PUBLISHER}/${NAME_DOTTED}/${platform}"
            tar -czf "${INSTALL_DIR}/${PUBLISHER}/${NAME_DOTTED}/${platform}/data.tgz" -C "dist/plugins/${BUILD}/${platform}" .
          done

          echo "Install structure (copy into Solar2DPlugins):"
          find dist/install -type f | sort

          # <build>-<platform>.tgz is the release asset naming the Solar2D Free
          # Plugin Directory expects.
          mkdir -p dist/release
          for platform in $DIST_PLATFORMS; do
            cp "${INSTALL_DIR}/${PUBLISHER}/${NAME_DOTTED}/${platform}/data.tgz" "dist/release/${BUILD}-${platform}.tgz"
          done

          echo "Release tarballs:"
          ls -la dist/release/

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: dist/plugins/
          if-no-files-found: error

      - name: Upload installable tarballs
        uses: actions/upload-artifact@v7
        with:
          name: plugin-tarballs
          path: dist/install/
          if-no-files-found: error

      - name: Create GitHub Release
        # Third-party action, pinned by commit SHA because a tag can be moved.
        # 8a0cd65 is release 3.0.4.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: v${{ needs.config.outputs.plugin_version }}
          # Without this a new tag lands on the default branch's HEAD, which is
          # not the built commit when the run was dispatched from another
          # branch or the branch moved during the run.
          target_commitish: ${{ github.sha }}
          name: v${{ needs.config.outputs.plugin_version }}
          files: dist/release/*.tgz
          generate_release_notes: true
